<header class="page-head">
  <h1 class="lead-title">Search</h1>
</header>
<form class="search-page-form" role="search" action="{{ '/search/' | relative_url }}" method="get">
  <label for="search-page-input" class="visually-hidden">Search the archive</label>
  <input id="search-page-input" type="search" name="q" placeholder="Papers, companies, topics">
  <button type="submit" class="button">Search</button>
</form>
<p id="search-status" class="muted" aria-live="polite"></p>
<ul id="search-results" class="archive-list"></ul>
<script>window.ESSCHER_INDEX = "{{ '/search.json' | relative_url }}";</script>
<script src="{{ '/assets/js/search.js' | relative_url }}"></script>
