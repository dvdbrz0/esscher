# Opens an issue (GitHub then emails the repository owner) when an edition
# that should be online is missing: the Daily Brief on weekdays, the Weekly
# Review on Sundays. The issue closes by itself once the edition is pushed.
name: Edition check

on:
  schedule:
    - cron: "40 3 * * 1-5"   # 06:40 Bucharest in summer, 05:40 in winter
    - cron: "30 7 * * 0"     # Sunday, 10:30 Bucharest in summer, 09:30 in winter
  push:
    branches: [main]
    paths: ["_posts/**"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Close alerts for editions that are now online
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --state open --label missing-edition --json number,title --jq '.[] | "\(.number) \(.title)"' 2>/dev/null |
          while read -r n rest; do
            day=$(echo "$rest" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')
            case "$rest" in *Weekly*) ed=weekly ;; *) ed=daily ;; esac
            if [ -n "$day" ] && [ -f "_posts/${day}-${ed}.md" ]; then
              gh issue close "$n" --comment "The edition is online now."
            fi
          done
      - name: Look for today's edition
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(TZ=Europe/Bucharest date +%Y-%m-%d)
          dow=$(TZ=Europe/Bucharest date +%u)
          if [ "$dow" = "7" ]; then edition=weekly; name="Weekly Review"
          elif [ "$dow" = "6" ]; then echo "Saturday: nothing is published."; exit 0
          else edition=daily; name="Daily Brief"; fi
          file="_posts/${today}-${edition}.md"
          if [ -f "$file" ]; then echo "Found $file"; exit 0; fi
          echo "Missing $file"
          title="Missing: ${name} of ${today}"
          gh label create missing-edition --color C2410C --description "An edition did not go online on time" 2>/dev/null || true
          exists=$(gh issue list --state open --label missing-edition --json title --jq ".[] | select(.title == \"$title\") | .title")
          if [ -z "$exists" ]; then
            gh issue create --label missing-edition --title "$title" --body "The ${name} for ${today} was not in the repository at $(date -u +%H:%M) UTC. Check the last run of the scheduled task in Claude. This issue closes by itself when the edition is pushed."
          fi
          exit 1
