# Refreshes live.json, the delayed quotes in the markets band, on weekdays while markets
# are open (13:00-21:45 UTC every 15 minutes; hourly in the European morning). Commits only
# when a quote changed. The band falls back to the edition's closing levels when live.json
# is older than the edition. Run it by hand with "check" to see what each source returns.
name: Markets band

on:
  schedule:
    - cron: "*/15 13-21 * * 1-5"
    - cron: "5 6-12 * * 1-5"
  workflow_dispatch:
    inputs:
      check:
        description: "Only print what each source returns; change nothing."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: markets
  cancel-in-progress: false

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the sources
        if: ${{ inputs.check }}
        run: python3 scripts/live_markets.py --check
      - name: Fetch quotes and commit
        if: ${{ !inputs.check }}
        run: |
          python3 scripts/live_markets.py
          if [ -z "$(git status --porcelain live.json)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json
          git commit -q -m "Markets band $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -q origin HEAD:main || { git pull -q --rebase origin main && git push -q origin HEAD:main; }
