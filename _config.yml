title: Esscher
description: "AI, machine learning and quantitative finance. Every weekday morning."
tagline: "AI, machine learning and quantitative finance. Every weekday morning."
# While the site is served from dvdbrz0.github.io/esscher the baseurl is /esscher.
# Once esscher.com points here: url "https://esscher.com", baseurl "" and add a CNAME file.
url: "https://dvdbrz0.github.io"
