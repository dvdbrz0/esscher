title: Esscher
description: "AI, machine learning and quantitative finance. Every weekday morning."
tagline: "AI, machine learning and quantitative finance. Every weekday morning."
# Served at https://esscher.com (custom domain set by the CNAME file).
url: "https://esscher.com"
baseurl: ""
timezone: Europe/Bucharest
lang: en
permalink: /:year/:month/:day/:title/
markdown: kramdown
future: true
collections:
  stories:
    output: true
    permalink: /stories/:path/
# GoatCounter site code (the part before .goatcounter.com). Empty = no analytics.
goatcounter: ""
plugins:
  - jekyll-feed
  - jekyll-sitemap
feed:
  path: feed.xml
exclude:
  - scripts
  - _docs
  - README.md
  - Gemfile
  - Gemfile.lock
