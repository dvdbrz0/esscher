{% if page.previous or page.next %}
<nav class="prev-next" aria-label="More editions">
  {% if page.previous %}<a href="{{ page.previous.url | relative_url }}"><span class="muted small">Previous</span><span>{{ page.previous.title | escape }}, {{ page.previous.date | date: "%-d %B %Y" }}</span></a>{% else %}<span></span>{% endif %}
  {% if page.next %}<a class="next" href="{{ page.next.url | relative_url }}"><span class="muted small">Next</span><span>{{ page.next.title | escape }}, {{ page.next.date | date: "%-d %B %Y" }}</span></a>{% endif %}
</nav>
{% endif %}
